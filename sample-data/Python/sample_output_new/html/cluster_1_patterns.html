<script>
        $(document).ready(function () { 
            $('ul.navbar-nav > li') 
                    .click(function (e) { 
                $('ul.navbar-nav > li') 
                    .removeClass('active'); 
                $(this).addClass('active'); 
            }); 
        });
 </script>
<script type="text/JavaScript">
       function activeLink(link){
           if(document.getElementById)
               document.getElementById(link).click();
           else if (document.all)
               document.all(link).focus();
        }
 </script>
