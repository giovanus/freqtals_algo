# JavaScript configuration for FREQTALS.
#
# FREQTALS mines XML AST files, not .js files directly.
# With actual_script/_4_generate_ast.py, put XML AST files in:
#   ast_xml
# Then run:
#   java -jar freqtals.jar conf/javascript/config.properties 2 ast_xml

2Class = false

inputPath = .
outputPath = js_output

# Parameters used only when 2Class = true.
inputPath1 = old
inputPath2 = new
minDSScore = 0.1
numPatterns = 100

timeout = 30

# These values favor small/medium vulnerability-oriented structures:
# calls, member access, assignments, branches, and local data-flow shapes.
minLeaf = 1
maxLeaf = 12
minNode = 4

twoStep = true
weighted = false
abstractLeafs = true

buildGrammar = true
rootLabelFile = conf/javascript/listRootLabel.txt
whiteLabelFile = conf/javascript/listWhiteLabel.txt
xmlCharacterFile = conf/javascript/xmlCharacters.txt
reservedVariableNameFile = conf/javascript/reservedVariable.txt
clusterConfig = conf/cluster_conf.json

minSupportList = 2,3,4,5
inFilesList = ast_xml
